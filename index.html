<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Island Game</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;

      background: #000;

<body>

  <div id="app"></div>

  <script
    type="module"
    src="/src/main.js"
